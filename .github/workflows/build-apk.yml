
name: Build QANOT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          pwd
          ls -la
          ls -la lib
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preserve QANOT source code
        run: cp lib/main.dart /tmp/qanot_main.dart

      - name: Create Android project files
        run: flutter create --platforms=android .

      - name: Restore QANOT source code
        run: cp /tmp/qanot_main.dart lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QANOT-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
