name: Build QANOT Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Flutter project structure
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter project files found."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preserve app entry point
        run: cp lib/main.dart /tmp/qanot_main.dart

      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Restore app entry point
        run: cp /tmp/qanot_main.dart lib/main.dart

      - name: Configure Android biometric authentication
        shell: bash
        run: |
          MAIN_ACTIVITY="$(find android/app/src/main/kotlin -name MainActivity.kt | head -n 1)"
          test -n "$MAIN_ACTIVITY"
          sed -i \
            -e 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' \
            -e 's/extends FlutterActivity/extends FlutterFragmentActivity/' \
            -e 's/: FlutterActivity()/: FlutterFragmentActivity()/' \
            "$MAIN_ACTIVITY"
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = ''
          for name in ('USE_BIOMETRIC', 'USE_FINGERPRINT'):
              tag = f'    <uses-permission android:name="android.permission.{name}" />\n'
              if f'android.permission.{name}' not in s:
                  permissions += tag
          if permissions:
              s = s.replace('<application', permissions + '    <application', 1)
          p.write_text(s)
          PYCODE

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QANOT-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
